name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Versao do aplicativo (ex: 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          .\windows\build-installer.ps1 -AppVersion "${{ github.event.inputs.app_version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: datagreen-windows-installer
          path: release/installer/DataGreen_Setup.exe
          if-no-files-found: error
